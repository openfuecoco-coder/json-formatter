<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>JSON 格式化</title>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #FDFBF7; color: #4A4036; display: flex; justify-content: center; padding: 20px; min-height: 100vh; box-sizing: border-box; }
    .container { background-color: #E8E4D9; padding: 2rem; border-radius: 12px; width: 100%; max-width: 600px; box-sizing: border-box; }
    textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid #C4B5A5; border-radius: 8px; background: #FDFBF7; color: #4A4036; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #C4B5A5; color: #FDFBF7; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
</style></head>
<body><div class="container"><h1>JSON 格式化</h1>
<textarea id="in" placeholder="輸入 JSON"></textarea>
<button onclick="f()">格式化</button>
<textarea id="out" readonly></textarea></div>
<script>function f(){try{const j=JSON.parse(document.getElementById('in').value);document.getElementById('out').value=JSON.stringify(j,null,4);}catch(e){alert("無效 JSON");}}</script>
</body></html>
