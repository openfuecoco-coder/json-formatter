<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>JSON 格式化</title>
<style>body{font-family:sans-serif;padding:20px;background:#f4f4f9;display:flex;justify-content:center;}
.c{background:white;padding:20px;width:100%;max-width:600px;border-radius:8px;}
textarea{width:100%;height:200px;} button{width:100%;padding:10px;background:#28a745;color:white;border:none;}
</style></head>
<body><div class="c"><h1>JSON 格式化</h1>
<textarea id="in" placeholder="輸入 JSON"></textarea>
<button onclick="f()">格式化</button>
<textarea id="out" readonly></textarea></div>
<script>function f(){try{const j=JSON.parse(document.getElementById('in').value);document.getElementById('out').value=JSON.stringify(j,null,4);}catch(e){alert("無效 JSON");}}</script>
</body></html>
